name: Salalah transfer verification

on:
  push:
    branches: [salalah-exact-deploy]
    paths:
      - '.github/workflows/salalah-transfer-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect client chunks and API hints
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          PAGE="$BASE/ja/f/YRo-2X4hIacV"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -L --fail --silent --show-error -A "$UA" -o page.html "$PAGE"
          python3 - <<'PY' > scripts.txt
          import re, html
          s=open('page.html',encoding='utf-8',errors='replace').read()
          seen=[]
          for m in re.finditer(r'<script[^>]+src="([^"]+)"',s,re.I):
              u=html.unescape(m.group(1))
              if u not in seen: seen.append(u)
          for u in seen: print(u)
          PY
          echo "scripts: $(wc -l < scripts.txt)"
          mkdir chunks
          n=0
          while IFS= read -r path; do
            n=$((n+1))
            enc=$(python3 - <<PY
          import urllib.parse
          print(urllib.parse.quote('''$path''', safe='/:._-'))
          PY
          )
            curl -L --fail --silent --show-error -A "$UA" -o "chunks/$n.js" "$BASE$enc" || true
          done < scripts.txt
          python3 - <<'PY'
          import pathlib,re
          terms=('download','presign','signed','file_id','public_id','share_id','api/','/api','token','expires','storage','blob')
          for p in sorted(pathlib.Path('chunks').glob('*.js')):
              s=p.read_text(encoding='utf-8',errors='replace')
              hits=[]
              for term in terms:
                  if term.lower() in s.lower(): hits.append(term)
              if hits:
                  print('\nFILE',p,'bytes',len(s),'hits',hits)
                  printed=0
                  for m in re.finditer(r'(download|presign|signed|file_id|public_id|share_id|/api|api/|token|expires)',s,re.I):
                      a=max(0,m.start()-700); b=min(len(s),m.end()+1600)
                      print(s[a:b])
                      printed+=1
                      if printed>=20: break
          print('\nPAGE STATE HINTS')
          ps=pathlib.Path('page.html').read_text(encoding='utf-8',errors='replace')
          for m in re.finditer(r'(download|file_id|public_id|share_id|37200839|skymundo-salalah|YRo-2X4hIacV|tSRbYYFK5Xz0Yug8)',ps,re.I):
              a=max(0,m.start()-500); b=min(len(ps),m.end()+1200)
              print(ps[a:b])
          PY
