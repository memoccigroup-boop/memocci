name: Salalah transfer verification

on:
  push:
    branches: [salalah-exact-deploy]
    paths:
      - '.github/workflows/salalah-transfer-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect download endpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          PAGE="$BASE/ja/f/YRo-2X4hIacV"
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -L --fail --silent --show-error -A "$UA" -o page.html "$PAGE"
          JS=$(python3 - <<'PY'
          import re
          s=open('page.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'src="([^"]*app/\(files\)/ja/f/page-[^"]+\.js)"',s)
          print(m.group(1) if m else '')
          PY
          )
          echo "JS=$JS"
          test -n "$JS"
          curl -L --fail --silent --show-error -A "$UA" -o bundle.js "$BASE$JS"
          python3 - <<'PY'
          import re
          s=open('bundle.js',encoding='utf-8',errors='replace').read()
          print('bundle bytes',len(s))
          terms=['download','api/','presign','signed','public_id','share','file_id','token','expires']
          for term in terms:
              print('\n###',term)
              c=0
              for m in re.finditer(term,s,re.I):
                  a=max(0,m.start()-500); b=min(len(s),m.end()+1000)
                  print(s[a:b])
                  c+=1
                  if c>=12: break
          PY
